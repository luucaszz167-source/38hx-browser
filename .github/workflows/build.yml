name: Build 38HX Browser APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir arquivos do projeto
        run: |
          echo "Arquivos principais:"
          find . -maxdepth 5 -type f | sort | head -200
          echo "Manifest:"
          cat app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("AndroidManifest.xml: XML válido")
          PY

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: 38HX-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
